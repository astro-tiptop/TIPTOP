[telescope]
TelescopeDiameter = 8.0
ZenithAngle = 45
ObscurationRatio = 0.14
Resolution = 320
PathPupil  = '$CALIBRATIONS_PATH$/VLT_CALIBRATION/VLT_PUPIL/ut4pupil320.fits'
PupilAngle = 0.0

[atmosphere]
Wavelength = 500e-9
Seeing = 1.0
L0 = 27.44
Cn2Weights = [0.59, 0.02, 0.04, 0.06, 0.01, 0.05, 0.09, 0.04, 0.05, 0.05]
Cn2Heights = [30, 140, 281, 562, 1125, 2250, 4500, 7750, 11000, 14000]
WindSpeed  = [6.6, 5.9, 5.1, 4.5, 5.1, 8.3, 16.3, 30.2, 34.3, 17.5]
WindDirection = [0., 0., 0., 0., 90., -90., -90., 90., 0., 0.]

[sources_science]
Wavelength = [750e-9]
Zenith  = [0]
Azimuth = [0]

[sources_HO]
Wavelength = 589e-9
Zenith  = [10.0, 10.0, 10.0, 10.0]
Azimuth = [0, 90, 180, 270]
Height = 90e3

[sources_LO]
Wavelength = 850e-9
Zenith  = [0.0]
Azimuth = [0.0]

[sensor_science]
PixelScale = 25.0
FieldOfView = 384
Binning = 1
NumberPhotons = [1500]
SpotFWHM = [[0.0, 0.0, 0.0]]
SpectralBandwidth = 0.0
Transmittance = [1.0]
Dispersion = [[0.0],[0.0]]
SigmaRON = [0.0]
Dark = 0.0
SkyBackground = 0.0
Gain = 1.0
ExcessNoiseFactor = 1.0
Zenith  = [0.0]
Azimuth = [0.0]

[sensor_HO]
WfsType = 'Shack-Hartmann'
Modulation = None
; TODO: Check
PixelScale = 830
; Pixels
FieldOfView = 240
Binning = 1
NumberPhotons = [200, 200, 200, 200]
SpotFWHM = [[1500.0, 1500.0, 0.0]]
SpectralBandwidth = 0.0
Transmittance = [1.0]
Dispersion = [[0.0],[0.0]]
SigmaRON = 0.8
Dark = 0.0
SkyBackground = 0.0
Gain = 1.0
ExcessNoiseFactor = 1.0
; Number of lenslets along one side
NumberLenslets = [40,40,40,40]
; TODO: check
SizeLenslets = [0.2,0.2,0.2,0.2]
NoiseVariance = [None]
Algorithm = 'wcog'
WindowRadiusWCoG = 6
ThresholdWCoG = 0.0
NewValueThrPix = 0.0

[sensor_LO]
PixelScale = 40.0
; TODO: check
FieldOfView = 200
Binning = 1
NumberPhotons = [200]
SpotFWHM = [[0.0,0.0,0.0]]
SigmaRON = 0.0
Dark = 0.0
SkyBackground = 0.0
Gain = 68.0
ExcessNoiseFactor = 1.0
NumberLenslets = [2]
Algorithm = 'wcog'
WindowRadiusWCoG = 2
ThresholdWCoG = 0.0
NewValueThrPix = 0.0

[DM]
; TODO: check
NumberActuators = [36]
DmPitchs = [0.2]
InfModel = 'gaussian'
InfCoupling = [0.4]
DmHeights = [0.0]
OptimizationZenith = [0]
OptimizationAzimuth = [0]
OptimizationWeight = [1]
OptimizationConditioning = 1.0e2
NumberReconstructedLayers = 2
AoArea = 'circle'

[RTC]
LoopGain_HO = 0.5
; Always 1000 Hz
SensorFrameRate_HO = 1000.0
LoopDelaySteps_HO = 2
; LO gain is between 0.3-0.5 depending on the brightness of the target
LoopGain_LO = 0.5
SensorFrameRate_LO = 200.0
; before the SPARTA upgrade, delay for IRLOS was equivalent to 2 frames at 500 Hz (4 ms total delay)
LoopDelaySteps_LO = 2

